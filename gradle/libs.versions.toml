[versions]
agp                  = "8.13.2"
kotlin               = "2.0.21"
coreKtx              = "1.16.0"
lifecycleRuntime     = "2.9.0"
activityCompose      = "1.10.1"
composeBom           = "2025.05.01"
navigationCompose    = "2.9.0"
viewmodelCompose     = "2.9.0"
retrofit             = "2.11.0"
okhttp               = "4.12.0"
serialization        = "1.8.1"
retrofitSerializer   = "1.0.0"
datastore            = "1.1.7"
coroutines           = "1.10.2"
splashscreen         = "1.0.1"
material             = "1.12.0"
junit                = "4.13.2"
junitVersion         = "1.2.1"
espressoCore         = "3.6.1"

[libraries]
# Core
androidx-core-ktx            = { group = "androidx.core",             name = "core-ktx",                               version.ref = "coreKtx"           }
androidx-lifecycle-runtime   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",                  version.ref = "lifecycleRuntime"   }
androidx-activity-compose    = { group = "androidx.activity",         name = "activity-compose",                       version.ref = "activityCompose"    }
androidx-splashscreen         = { group = "androidx.core",            name = "core-splashscreen",                      version.ref = "splashscreen"       }
material                     = { group = "com.google.android.material", name = "material",                             version.ref = "material"           }

# Compose BOM + UI
androidx-compose-bom         = { group = "androidx.compose",          name = "compose-bom",                            version.ref = "composeBom"         }
androidx-compose-ui          = { group = "androidx.compose.ui",       name = "ui"                                                                         }
androidx-compose-ui-graphics = { group = "androidx.compose.ui",       name = "ui-graphics"                                                                }
androidx-compose-ui-preview  = { group = "androidx.compose.ui",       name = "ui-tooling-preview"                                                         }
androidx-compose-ui-tooling  = { group = "androidx.compose.ui",       name = "ui-tooling"                                                                 }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3"                                                                 }
androidx-compose-icons       = { group = "androidx.compose.material", name = "material-icons-extended"                                                    }

# Navigation + ViewModel
androidx-navigation-compose  = { group = "androidx.navigation",       name = "navigation-compose",                     version.ref = "navigationCompose"  }
androidx-viewmodel-compose   = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",            version.ref = "viewmodelCompose"   }
androidx-lifecycle-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",              version.ref = "viewmodelCompose"   }

# Red — Retrofit + OkHttp
retrofit-core                = { group = "com.squareup.retrofit2",    name = "retrofit",                               version.ref = "retrofit"           }
okhttp-core                  = { group = "com.squareup.okhttp3",      name = "okhttp",                                 version.ref = "okhttp"             }
okhttp-logging               = { group = "com.squareup.okhttp3",      name = "logging-interceptor",                    version.ref = "okhttp"             }

# Kotlinx Serialization + Retrofit Converter
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx",    name = "kotlinx-serialization-json",             version.ref = "serialization"      }
retrofit-kotlinx-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerializer" }

# DataStore (persistencia de sesión JWT)
androidx-datastore           = { group = "androidx.datastore",        name = "datastore-preferences",                  version.ref = "datastore"          }

# Coroutines
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",             version.ref = "coroutines"         }

# Tests
junit                        = { group = "junit",                     name = "junit",                                  version.ref = "junit"              }
androidx-junit               = { group = "androidx.test.ext",         name = "junit",                                  version.ref = "junitVersion"       }
androidx-espresso-core       = { group = "androidx.test.espresso",    name = "espresso-core",                          version.ref = "espressoCore"       }

[plugins]
android-application     = { id = "com.android.application",                      version.ref = "agp"    }
kotlin-android          = { id = "org.jetbrains.kotlin.android",                  version.ref = "kotlin" }
# Kotlin 2.0+: plugin dedicado para Compose (reemplaza kotlinCompilerExtensionVersion)
kotlin-compose          = { id = "org.jetbrains.kotlin.plugin.compose",           version.ref = "kotlin" }
# Kotlinx Serialization
kotlin-serialization    = { id = "org.jetbrains.kotlin.plugin.serialization",     version.ref = "kotlin" }
